name: Import source and build TreasureBot APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .source-parts/p0* | base64 --decode > /tmp/treasurebot-source.tar.xz
          echo "e9907f89d6c04afbe05ce6a41422ae10b3707607d2a03fb3740c3bc59b76e4b5  /tmp/treasurebot-source.tar.xz" | sha256sum --check
          tar -xJf /tmp/treasurebot-source.tar.xz -C .
          test -f app/src/main/AndroidManifest.xml
          test -f .github/workflows/build-apk.yml
          rm -rf .source-parts .github/workflows/bootstrap.yml
      - name: Save full source files in Git
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import complete Treasure Watch Android source" || true
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK checksum
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TreasureWatch-0.2-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
